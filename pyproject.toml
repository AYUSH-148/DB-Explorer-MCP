[project]
name = "db-explorer-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for PostgreSQL, MySQL, and SQLite: schema exploration, safe SELECT queries, EXPLAIN plans, index suggestions, and migration review."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "fastmcp",
    "sql",
    "database",
    "postgresql",
    "mysql",
    "sqlite",
    "sqlalchemy",
    "read-only",
    "text-to-sql",
    "llm",
    "ai-agents",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=3.4.7",
    "mcp>=1.29.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "sqlparse>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/AYUSH-148/DB-Explorer-MCP"
Repository = "https://github.com/AYUSH-148/DB-Explorer-MCP"
Issues = "https://github.com/AYUSH-148/DB-Explorer-MCP/issues"

[project.scripts]
db-explorer-mcp-server = "server:run_server"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ponytail: flat top-level modules, so generic names (config, db, errors) can
# clash in a shared venv; uvx isolates each tool. Move into a package if pip
# installs into shared environments become common.
[tool.hatch.build.targets.wheel]
only-include = [
    "auth.py",
    "config.py",
    "db.py",
    "errors.py",
    "explain.py",
    "index_suggest.py",
    "indexes.py",
    "inspector.py",
    "migration.py",
    "safety.py",
    "schema_health.py",
    "serialization.py",
    "server.py",
]

# sample.db is gitignored (generated by seed_demo_db.py), so it must be forced in.
# config.py falls back to it when DATABASE_URL is unset.
[tool.hatch.build.targets.wheel.force-include]
"sample.db" = "sample.db"

[tool.hatch.build.targets.sdist.force-include]
"sample.db" = "sample.db"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

# Keep the dev env uninstalled, as before packaging: installing would build the
# wheel, which needs the gitignored sample.db that a fresh clone (CI) lacks.
# `uv build` is unaffected.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Bug-catching rules only (syntax errors, undefined names, unused imports).
select = ["E4", "E7", "E9", "F"]
