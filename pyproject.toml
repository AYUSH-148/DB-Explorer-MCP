[project]
name = "db-explorer-mcp"
version = "0.1.0"
description = "An MCP server for safe database exploration and SQL analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "sqlparse>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
